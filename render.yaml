# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the API (web), Postgres and Key Value (Redis), all on free plans.
#
# Free-tier mode: there is no separate Celery worker. CELERY_TASK_ALWAYS_EAGER=true makes
# background tasks (webhook processing, refunds, link cancellation) run inside the web
# request: slower, still correct, because webhooks are stored before processing and every
# handler is idempotent. The 02:00 reconciliation has no scheduler in this mode: use
# Django Admin -> Reconciliation runs -> "Run reconciliation now" (or add a worker later;
# see bin/start-worker.sh, which runs Celery with Beat).
# Free Postgres instances expire after a trial period; see Render's pricing page.

services:
  - name: centrepay-api
    type: web
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: sh bin/start-web.sh
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: centrepay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: centrepay-redis
          type: keyvalue
          property: connectionString
      # "fake" = built-in sandbox gateway (demo without Razorpay). Switch to "razorpay"
      # and fill the three RAZORPAY_* values below to take real test-mode payments.
      - key: PAYMENT_GATEWAY
        value: fake
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"

  - name: centrepay-redis
    type: keyvalue
    plan: free
    region: singapore
    ipAllowList: [] # only reachable from our own Render services

databases:
  - name: centrepay-db
    plan: free
    region: singapore
    databaseName: centrepay
    user: centrepay
