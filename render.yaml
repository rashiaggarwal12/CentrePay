# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the API (web), a Celery worker (with Beat), Postgres and Key Value (Redis).
#
# Cost note: web, Postgres and Key Value use free plans. The worker has no free plan here.
# For a free-only demo, delete the `centrepay-worker` service below and set
# CELERY_TASK_ALWAYS_EAGER=true on the web service (tasks then run inline; trigger the daily
# reconciliation manually with `python manage.py reconcile` from the web service's Shell).
# Free Postgres instances expire after a trial period; see Render's pricing page.

services:
  - name: centrepay-api
    type: web
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: sh bin/start-web.sh
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: centrepay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: centrepay-redis
          type: keyvalue
          property: connectionString
      # "fake" = built-in sandbox gateway (demo without Razorpay). Switch to "razorpay"
      # and fill the three RAZORPAY_* values below to take real test-mode payments.
      - key: PAYMENT_GATEWAY
        value: fake
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"

  - name: centrepay-worker
    type: worker
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh bin/start-worker.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: centrepay-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: centrepay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: centrepay-redis
          type: keyvalue
          property: connectionString
      - key: PAYMENT_GATEWAY
        fromService:
          name: centrepay-api
          type: web
          envVarKey: PAYMENT_GATEWAY
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - name: centrepay-redis
    type: keyvalue
    plan: free
    region: singapore
    ipAllowList: [] # only reachable from our own Render services

databases:
  - name: centrepay-db
    plan: free
    region: singapore
    databaseName: centrepay
    user: centrepay
