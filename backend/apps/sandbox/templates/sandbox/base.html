<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sandbox Payments{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#667085; --line:#e4e7ec;
            --brand:#2f6fed; --ok:#12805c; --bad:#c4320a; --warn:#b54708; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
           background:var(--bg); color:var(--text); }
    .banner { background:#fef0c7; color:#7a2e0e; text-align:center; padding:8px 16px;
              font-size:14px; font-weight:600; }
    main { max-width:440px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:20px; margin-bottom:16px; }
    .muted { color:var(--muted); font-size:14px; }
    .amount { font-size:36px; font-weight:700; margin:4px 0 0; font-variant-numeric:tabular-nums; }
    button { width:100%; padding:14px; margin-top:10px; border-radius:10px; font-size:16px;
             font-weight:600; cursor:pointer; border:1px solid var(--line); background:#fff; }
    button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
    button.danger { color:var(--bad); }
    details { margin-top:16px; }
    summary { cursor:pointer; color:var(--muted); font-size:14px; }
    details button { font-size:14px; padding:10px; text-align:left; }
    details button small { display:block; font-weight:400; color:var(--muted); }
    .status { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px;
              font-weight:600; background:#eef4ff; color:var(--brand); }
    .status.paid { background:#e7f6ee; color:var(--ok); }
    .status.expired, .status.cancelled { background:#f2f4f7; color:var(--muted); }
    .result { font-size:20px; font-weight:700; }
    .result.ok { color:var(--ok); } .result.bad { color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    td, th { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); }
    a { color:var(--brand); }
  </style>
</head>
<body>
  <div class="banner">SANDBOX — no real money moves. Replace with Razorpay by adding API keys.</div>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
